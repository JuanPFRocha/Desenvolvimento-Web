{% load static %}

<html>
    <head>
        <title>
            Sistema Acadêmico
        </title>
            <link rel="stylesheet" href="{% static 'css/style.css' %}">

    </head>
    <body>
        <div class="form-container">
        <h1> Adicionar Curso</h1>

            <form method = "POST" enctype="multipart/form-data">
                {% csrf_token %}
                {% for atrib in form %}
                    <div class="form-group">
                        <label for="{{ atrib.id_for_label}}">{{atrib.label}}</label>
                        {{atrib}}
                        {% if atrib.help_text %}
                            <small style="color: #64748b;">{{ atrib.help_text }}</small>                    </div>
                            {% endif %}
                            {% if atrib.errors %}
                            <div class="errorlist">
                                {{ atrib.errors }}
                            </div>
                            {% endif %}

                        </div>
                        {% endfor %}
                    <div class="btn-group">
                        <button type = "submit">Salvar</button>
                        <a href="{% url 'listagemCurso' %}" class="btn-cancel">Cancelar</a>
                    </div>
            </form>
        </div>
        </body>
</html>
