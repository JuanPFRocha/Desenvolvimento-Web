<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Cursos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 bg-light" style="border:1px solid ; background-color:#1111; border-radius: 10px;">
    <h1 class="m-4 text-center">Registros dos Cursos <a href="{% url 'adicionarCurso' %}" class="btn btn-primary">Adicionar Curso</a></h1>
    <table class="table table-bordered">
        <tr class="bg-info text-white text-center ">
            <td> Código  </td>
            <td> Nome </td>
            <td> Foto </td>
            <td> Duração (Anos)</td>
            <td> Data de início </td>
            <td> Carga Horária </td>
            <td> Ações </td>
        </tr>
        {% for est in listaEst %}
        <tr class="text-center">
            <td>{{ est.codigo }}</td>
            <td>{{ est.nome }}</td>
            <td><img src="/medias/{{ est.foto }}"class="rounded-circle" height="70px" width="70px"></td>
            <td>{{ est.duracao }}</td>
            <td>{{ est.data_inicio}}</td>
            <td>{{ est.carga_horaria}}</td> 
            <td> 
                <a href="{% url 'editarCurso' est.codigo %}" class="btn btn-success">Editar</a>
                <form method="POST" action="{% url 'deletarCurso' est.codigo %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Apagar</button>
                </form> 
                <a href="/visualizar/{{est.id}}" class="btn btn-primary">Ver</a>
            </td>
        </tr>
    {%endfor%}
    </table>
    <div>
        <a href="/" class="btn btn-success">Voltar</a>
    </div>
</div>
</body>
</html>
